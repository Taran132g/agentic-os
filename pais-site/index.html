<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PAIS · Batcave</title>
<link rel="icon" href="/cave/bat.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/cave/css/batcave.css">
</head>
<body>
<div class="fog" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<!-- ============ GATE: authenticator login ============ -->
<section id="gate" aria-labelledby="gate-title">
  <div class="gate-bg" aria-hidden="true"></div>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <p class="wordmark" id="gate-title">PAIS</p>
    <p class="wordmark-sub">Personal AI System · Batcomputer</p>
    <p class="gate-prompt" id="gate-prompt">Authenticator code or passcode, sir.</p>
    <div class="code-cells" id="cells" role="group" aria-label="Six character code"></div>
    <p class="gate-foot">Same code as your QUANT_OS trading dashboard</p>
  </form>
</section>

<!-- ============ CAVE: the app ============ -->
<div id="cave" hidden>
  <div class="chrome">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 200 90" data-bat aria-hidden="true"></svg>PAIS <small>// BATCOMPUTER</small></div>
    <div class="clock mono" id="clock"></div>
    <div class="toggles" role="group" aria-label="Audio">
      <button class="tog" id="t-cave" type="button" aria-pressed="false" title="Cave ambience">CAVE</button>
      <button class="tog" id="t-aura" type="button" aria-pressed="false" title="Aura track">AURA</button>
      <button class="tog" id="t-voice" type="button" aria-pressed="true" title="Alfred's voice">ALFRED</button>
      <button class="tog" id="t-lock" type="button" title="Lock the Batcomputer">LOCK</button>
    </div>
  </header>
  <div class="stale" id="stale" hidden role="status"></div>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>
  <main id="view" tabindex="-1"></main>
</div>

<aside id="alfred" class="idle" hidden aria-live="polite">
  <span class="who">ALFRED</span>
  <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  <span class="said" id="alfred-said"></span>
</aside>

<audio id="aura" src="/cave/audio/aura.mp3" preload="none" loop></audio>
<script src="/cave/vendor/lightweight-charts.js"></script>
<script type="module" src="/cave/js/app.js"></script>
</body>
</html>
